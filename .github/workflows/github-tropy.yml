name: GitHub Profile Trophy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Singapore"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: bert093
          file: trophy.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      - name: Commit trophy SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trophy.svg

          if git diff --cached --quiet; then
            echo "No changes to trophy.svg."
            exit 0
          fi

          git commit -m "Update GitHub trophy"
          git push
